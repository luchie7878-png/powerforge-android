plugins { id 'com.android.application' }

// Signing config is read from keystore/keystore.properties (git-ignored, never commit it).
def ksPropsFile = rootProject.file('keystore/keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) { ksPropsFile.withInputStream { ksProps.load(it) } }

def twa = [
    applicationId : 'app.abacusai.powerforge',
    hostName      : 'powerforge.abacusai.app',
    launchUrl     : '/',
    name          : 'PowerForge',
    launcherName  : 'PowerForge',
    themeColor    : '#0F0F0F',
    navColor      : '#0F0F0F',
    backgroundColor: '#0F0F0F',
]

android {
    namespace 'app.abacusai.powerforge'
    compileSdk 35

    defaultConfig {
        applicationId twa.applicationId
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        resValue 'string', 'appName', twa.name
        resValue 'string', 'launcherName', twa.launcherName
        resValue 'string', 'hostName', twa.hostName
        resValue 'string', 'launchUrl', "https://${twa.hostName}${twa.launchUrl}"
        resValue 'string', 'assetStatements',
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${twa.hostName}\\\"}}]"
        resValue 'color', 'colorPrimary', twa.themeColor
        resValue 'color', 'navigationColor', twa.navColor
        resValue 'color', 'backgroundColor', twa.backgroundColor
        resValue 'string', 'providerAuthority', "${twa.applicationId}.fileprovider"
    }

    signingConfigs {
        release {
            if (ksPropsFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (ksPropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
